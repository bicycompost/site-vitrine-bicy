# Envoie le dossier site/ sur l'hébergement OVH (dossier www) à chaque modification.
# Secrets à créer dans GitHub (Settings > Secrets and variables > Actions) :
#   OVH_FTP_SERVER   ex. ftp.cluster130.hosting.ovh.net
#   OVH_FTP_USER     identifiant FTP OVH
#   OVH_FTP_PASSWORD mot de passe FTP OVH
name: Déploiement OVH

on:
  push:
    branches: [main, ccr-05c9a575-9hueq1]
    paths: ["site/**"]
  workflow_dispatch:

concurrency: deploiement-ovh

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installation de lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Envoi SFTP vers OVH (environ 2 minutes)
        env:
          SERVER: ${{ secrets.OVH_FTP_SERVER }}
          USER: ${{ secrets.OVH_FTP_USER }}
          LFTP_PASSWORD: ${{ secrets.OVH_FTP_PASSWORD }}
        run: |
          lftp -c "
            set sftp:auto-confirm yes
            set net:max-retries 3
            set net:timeout 30
            open --env-password -u \"$USER\" sftp://$SERVER:22
            mirror --reverse --delete --verbose=1 --parallel=4 ./site/ www/
          "
